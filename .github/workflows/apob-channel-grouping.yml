name: APOB channel grouping regression

on:
  push:
    branches:
      - fix/apob-infer-memory-pstates
  pull_request:
    paths:
      - 'Hardware/Apob/Apob.cs'
      - 'Hardware/Apob/ApobTimingBlockGrouping.cs'
      - 'tests/ApobTimingBlockGroupingSmoke/**'
      - '.github/workflows/apob-channel-grouping.yml'

permissions:
  contents: read

jobs:
  grouping-regression:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run grouped channel/P-state regression scenarios
        shell: pwsh
        run: dotnet run --project tests/ApobTimingBlockGroupingSmoke/ApobTimingBlockGroupingSmoke.csproj --configuration Release
